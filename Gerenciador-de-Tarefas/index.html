
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header class="header">
            <div>
                <h1>Minhas Tarefas</h1>
                <p>Organize seu dia e acompanhe seu progresso.</p>
            </div>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span>Total de tarefas</span>
                <strong id="totalTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>Pendentes</span>
                <strong id="pendingTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>Concluídas</span>
                <strong id="completedTasks">0</strong>
            </div>
        </section>

        <section class="task-form">
            <h2>Adicionar nova tarefa</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="O que você precisa fazer?"
                    required
                >

                <select id="priorityInput">
                    <option value="baixa">Prioridade baixa</option>
                    <option value="media" selected>Prioridade média</option>
                    <option value="alta">Prioridade alta</option>
                </select>

                <button type="submit">Adicionar tarefa</button>
            </form>
        </section>

        <section class="task-section">

            <div class="task-header">
                <h2>Minhas atividades</h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Buscar tarefa..."
                >
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="todas">
                    Todas
                </button>

                <button class="filter-btn" data-filter="pendentes">
                    Pendentes
                </button>

                <button class="filter-btn" data-filter="concluidas">
                    Concluídas
                </button>
            </div>

            <div id="taskList" class="task-list"></div>

            <p id="emptyMessage" class="empty-message">
                Nenhuma tarefa encontrada.
            </p>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
